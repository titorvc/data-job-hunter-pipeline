services:
  # --- CAPA 1: ALMACENAMIENTO VECTORIAL ---
  postgres:
    image: ankane/pgvector:latest
    container_name: hunter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roberto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: job_hunter
    ports:
      - "5433:5432" 
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # --- CAPA 2: MOTOR ETL (AIRFLOW) ---
  airflow-init:
    build: .
    container_name: airflow_init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://roberto:${POSTGRES_PASSWORD:-change_me}@postgres:5432/job_hunter
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=roberto
      - _AIRFLOW_WWW_USER_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp_key.json
    volumes:
      - /home/titorvc/Documents/job_hunter_ai/data-hunter-494609-28589563a2a1.json:/opt/airflow/gcp_key.json
    command: version
    depends_on:
      - postgres

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://roberto:${POSTGRES_PASSWORD:-change_me}@postgres:5432/job_hunter
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp_key.json
      # --- OPTIMIZACIONES PARA BAJO CONSUMO DE CPU ---
      - AIRFLOW__CORE__PARALLELISM=2
      - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=2
      - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=1
      - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=300
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=300
      - AIRFLOW__SCHEDULER__PARSING_PROCESSES=1
      - AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC=30
      - AIRFLOW__SCHEDULER__PROCESSOR_POLL_INTERVAL=5
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /home/titorvc/Documents/job_hunter_ai/data-hunter-494609-28589563a2a1.json:/opt/airflow/gcp_key.json
    command: scheduler
    depends_on:
      - postgres
      - airflow-init

